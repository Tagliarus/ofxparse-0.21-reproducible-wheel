name: ofxparse 0.21 reproducible wheel

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase83-ofxparse-wheel.yml

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      bundle_chunk_count: ${{ steps.build.outputs.bundle_chunk_count }}
      bundle_sha256: ${{ steps.build.outputs.bundle_sha256 }}
      bundle_size: ${{ steps.build.outputs.bundle_size }}
      bundle_b64_0: ${{ steps.build.outputs.bundle_b64_0 }}
      bundle_b64_1: ${{ steps.build.outputs.bundle_b64_1 }}
      bundle_b64_2: ${{ steps.build.outputs.bundle_b64_2 }}
      bundle_b64_3: ${{ steps.build.outputs.bundle_b64_3 }}
    steps:
      - name: Verify inputs and build twice in isolated Docker containers
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import email.parser
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import re
          import socket
          import stat
          import subprocess
          import sys
          import tarfile
          import tempfile
          import urllib.request
          import venv
          import zipfile

          ROOT = Path(os.environ["RUNNER_TEMP"]) / "phase83"
          INPUT = ROOT / "input"
          TOOLS = ROOT / "toolchain"
          WORK = ROOT / "work"
          OUT = ROOT / "out"
          ARTIFACT = ROOT / "artifact"
          IMAGE_TAG = "python:3.11.9-slim-bookworm"
          MAX_WHEEL_BYTES = 2 * 1024 * 1024
          BUNDLE_MAX_BYTES = 196608
          BUNDLE_CHUNK_BYTES = 65536
          BUNDLE_CHUNK_COUNT = 4
          GITHUB_ENV_STRING_LIMIT_BYTES = 131072
          GITHUB_JOB_OUTPUT_LIMIT_BYTES = 1000000
          GITHUB_JOB_OUTPUT_RESERVE_BYTES = 8192
          MAX_WHEEL_MEMBERS = 512
          MAX_WHEEL_UNCOMPRESSED_BYTES = 5 * 1024 * 1024
          SOURCE = {
              "name": "ofxparse-0.21.tar.gz",
              "url": "https://files.pythonhosted.org/packages/45/ae/98a2acfd06d15869c4b1be7fb74849c8a67cf15b65181f1fe879547e7494/ofxparse-0.21.tar.gz",
              "size": 53837,
              "sha256": "057ab68d31270dece4d1a47662096aa76341968aaee145ffc711cb44cbd5c4a7",
          }
          BUILD_TOOLS = [
              {"name": "pip", "version": "26.3", "filename": "pip-26.3-py3-none-any.whl", "size": 1950951,
               "sha256": "f3b60b20ffaadd4415ed7957212a38ac63fa4c5fa375bd0f4a797777940fad13",
               "url": "https://files.pythonhosted.org/packages/07/25/ee8c38ae72d66b844ce8eb9711ba905dba21ca1a8a0c960057c41cd23337/pip-26.3-py3-none-any.whl"},
              {"name": "setuptools", "version": "84.2.1", "filename": "setuptools-84.2.1-py3-none-any.whl", "size": 876263,
               "sha256": "ca140b45d5325a9478f880e351484f62fef15f336462e449ca0c03c873d589c2",
               "url": "https://files.pythonhosted.org/packages/ef/55/6dc6d6bb953bdfc52519a0059592c52b6e3b8ad51cf8256dffceb55b0610/setuptools-84.2.1-py3-none-any.whl"},
          ]
          EPOCH = 1783123200
          EXPECTED_PROBES = (
              "container_config_verified", "uid_non_root", "capabilities_zero", "no_new_privs",
              "readonly_rootfs", "input_readonly", "runtime_readonly", "toolchain_readonly",
              "work_write", "out_write", "loopback_positive", "external_tcp_parent_denied",
              "external_tcp_child_denied", "input_write_denied", "input_chmod_denied",
              "runtime_write_denied", "runtime_chmod_denied", "toolchain_write_denied",
              "toolchain_chmod_denied", "host_cwd_inaccessible", "host_sentinel_inaccessible",
              "host_fd_inaccessible", "private_pid_namespace", "private_mount_namespace",
              "docker_socket_absent", "host_proc_absent", "pip_check", "source_unchanged",
          )

          def run(argv, *, capture=True):
              result = subprocess.run(argv, check=False, text=True, capture_output=capture)
              if result.returncode:
                  detail = result.stderr[-2000:] if capture else ""
                  raise RuntimeError(f"command_failed:{argv[0]}:{result.returncode}:{detail}")
              return result.stdout if capture else ""

          def validate_output_budget(values):
              utf16_bytes = 0
              for name, value in values.items():
                  if not isinstance(name, str) or not name.isascii() or not isinstance(value, str) or not value.isascii():
                      raise RuntimeError("public_bundle_output_not_ascii")
                  if len((name + "=" + value).encode("ascii")) >= GITHUB_ENV_STRING_LIMIT_BYTES:
                      raise RuntimeError("public_bundle_output_value_limit_exceeded")
                  utf16_bytes += len((name + "=" + value + "\n").encode("utf-16-le"))
              if utf16_bytes + GITHUB_JOB_OUTPUT_RESERVE_BYTES >= GITHUB_JOB_OUTPUT_LIMIT_BYTES:
                  raise RuntimeError("public_bundle_job_output_limit_exceeded")
              return utf16_bytes

          def validate_bundle_output(values, expected_payload):
              expected_names = {
                  "bundle_chunk_count", "bundle_size", "bundle_sha256",
                  *(f"bundle_b64_{index}" for index in range(BUNDLE_CHUNK_COUNT)),
              }
              if not isinstance(values, dict) or set(values) != expected_names:
                  raise RuntimeError("public_bundle_output_fields_invalid")
              validate_output_budget(values)
              count_text = values["bundle_chunk_count"]
              size_text = values["bundle_size"]
              digest = values["bundle_sha256"]
              if not isinstance(count_text, str) or not re.fullmatch(r"[1-4]", count_text):
                  raise RuntimeError("public_bundle_chunk_count_invalid")
              if (not isinstance(size_text, str) or not re.fullmatch(r"[1-9][0-9]{0,5}", size_text)
                      or int(size_text) > BUNDLE_MAX_BYTES):
                  raise RuntimeError("public_bundle_size_invalid")
              if not isinstance(digest, str) or not re.fullmatch(r"[0-9a-f]{64}", digest):
                  raise RuntimeError("public_bundle_sha256_invalid")
              count = int(count_text)
              pieces = []
              for index in range(BUNDLE_CHUNK_COUNT):
                  chunk = values[f"bundle_b64_{index}"]
                  if not isinstance(chunk, str) or not chunk.isascii() or any(character.isspace() for character in chunk):
                      raise RuntimeError("public_bundle_chunk_invalid")
                  if len(chunk) > BUNDLE_CHUNK_BYTES:
                      raise RuntimeError("public_bundle_chunk_size_invalid")
                  if index < count:
                      if not chunk:
                          raise RuntimeError("public_bundle_chunk_missing")
                      pieces.append(chunk)
                  elif chunk:
                      raise RuntimeError("public_bundle_trailing_chunk_nonempty")
              encoded = "".join(pieces)
              try:
                  payload = base64.b64decode(encoded, validate=True)
              except (ValueError, base64.binascii.Error):
                  raise RuntimeError("public_bundle_base64_invalid") from None
              if (base64.b64encode(payload).decode("ascii") != encoded or len(payload) != int(size_text)
                      or hashlib.sha256(payload).hexdigest() != digest or payload != expected_payload):
                  raise RuntimeError("public_bundle_output_integrity_mismatch")
              return payload

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def read_verified_wheel_directory(directory, expected_name):
              """Read one allowlisted regular wheel without following a backend link."""
              directory = Path(directory)
              before = directory.lstat()
              if not stat.S_ISDIR(before.st_mode):
                  raise RuntimeError("output_root_not_directory")
              directory_fd = os.open(directory, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  opened_directory = os.fstat(directory_fd)
                  if (opened_directory.st_dev, opened_directory.st_ino) != (before.st_dev, before.st_ino):
                      raise RuntimeError("output_root_changed")

                  def checked_entry():
                      with os.scandir(directory_fd) as entries:
                          rows = list(entries)
                      if [entry.name for entry in rows] != [expected_name]:
                          raise RuntimeError("unexpected_wheel_output_tree")
                      entry = rows[0]
                      observed = entry.stat(follow_symlinks=False)
                      if (not stat.S_ISREG(observed.st_mode) or observed.st_nlink != 1
                              or observed.st_size <= 0 or observed.st_size > MAX_WHEEL_BYTES):
                          raise RuntimeError("wheel_output_not_single_regular_file")
                      return observed

                  observed = checked_entry()
                  wheel_fd = os.open(expected_name, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC, dir_fd=directory_fd)
                  try:
                      opened = os.fstat(wheel_fd)
                      if (opened.st_dev, opened.st_ino, opened.st_mode, opened.st_nlink) != (
                          observed.st_dev, observed.st_ino, observed.st_mode, 1
                      ) or not stat.S_ISREG(opened.st_mode):
                          raise RuntimeError("wheel_output_changed_or_not_regular")
                      with os.fdopen(wheel_fd, "rb", closefd=False) as stream:
                          payload = stream.read(MAX_WHEEL_BYTES + 1)
                      if len(payload) != opened.st_size or len(payload) > MAX_WHEEL_BYTES:
                          raise RuntimeError("wheel_output_size_changed_or_exceeded_limit")
                  finally:
                      os.close(wheel_fd)
                  final = checked_entry()
                  if (final.st_dev, final.st_ino) != (observed.st_dev, observed.st_ino):
                      raise RuntimeError("wheel_output_changed_after_read")
                  return payload
              finally:
                  os.close(directory_fd)

          def validate_artifact_tree(directory, expected_files):
              """Fail closed if staging contains links, special files, or extra paths."""
              root = Path(directory)
              root_stat = root.lstat()
              if not stat.S_ISDIR(root_stat.st_mode):
                  raise RuntimeError("artifact_root_not_directory")
              found = set()
              found_directories = set()
              pending = [(root, "")]
              while pending:
                  parent, relative = pending.pop()
                  with os.scandir(parent) as entries:
                      rows = list(entries)
                  for entry in rows:
                      child_relative = f"{relative}/{entry.name}" if relative else entry.name
                      child_stat = entry.stat(follow_symlinks=False)
                      if stat.S_ISDIR(child_stat.st_mode):
                          found_directories.add(child_relative)
                          pending.append((Path(entry.path), child_relative))
                      elif stat.S_ISREG(child_stat.st_mode) and child_stat.st_nlink == 1:
                          found.add(child_relative)
                      else:
                          raise RuntimeError("artifact_contains_link_or_special_file")
              if found != set(expected_files):
                  raise RuntimeError("artifact_allowlist_mismatch")
              expected_directories = {"build-1", "build-2"} if any(path.startswith("build-") for path in expected_files) else set()
              if found_directories != expected_directories:
                  raise RuntimeError("artifact_directory_allowlist_mismatch")

          for path in (INPUT, TOOLS, WORK, OUT, ARTIFACT):
              path.mkdir(parents=True, exist_ok=True)

          github_repository = os.environ.get("GITHUB_REPOSITORY", "")
          github_ref = os.environ.get("GITHUB_REF", "")
          github_sha = os.environ.get("GITHUB_SHA", "").casefold()
          github_workflow_ref = os.environ.get("GITHUB_WORKFLOW_REF", "")
          raw_run_id = os.environ.get("GITHUB_RUN_ID", "")
          runner_os = os.environ.get("RUNNER_OS", "")
          runner_image_os = os.environ.get("ImageOS", "")
          runner_image_version = os.environ.get("ImageVersion", "")
          def verify_initial_push_commit():
              event_name = os.environ.get("GITHUB_EVENT_NAME", "")
              event_path = os.environ.get("GITHUB_EVENT_PATH", "")
              if event_name != "push" or not event_path:
                  raise RuntimeError("initial_push_event_missing")
              try:
                  event = json.loads(Path(event_path).read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                  raise RuntimeError("initial_push_event_invalid") from None
              repository = event.get("repository", {}).get("full_name") if isinstance(event, dict) else None
              before = event.get("before") if isinstance(event, dict) else None
              after = event.get("after") if isinstance(event, dict) else None
              if (repository != "Tagliarus/ofxparse-0.21-reproducible-wheel"
                      or event.get("ref") != "refs/heads/main"
                      or before != "0" * 40 or after != github_sha):
                  raise RuntimeError("initial_push_event_identity_invalid")
              commits = event.get("commits")
              if (not isinstance(commits, list) or len(commits) != 1
                      or not isinstance(commits[0], dict) or commits[0].get("id") != github_sha):
                  raise RuntimeError("initial_push_commit_list_invalid")
              def get_public_api_object(path):
                  request = urllib.request.Request(
                      "https://api.github.com" + path,
                      headers={"Accept": "application/vnd.github+json", "User-Agent": "ofxparse-0.21-reproducible-wheel",
                               "X-GitHub-Api-Version": "2022-11-28"},
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          return json.loads(response.read(256 * 1024).decode("utf-8"))
                  except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                      raise RuntimeError("initial_push_public_api_unavailable_or_invalid") from None
              repository_info = get_public_api_object("/repos/Tagliarus/ofxparse-0.21-reproducible-wheel")
              if (not isinstance(repository_info, dict)
                      or repository_info.get("full_name") != "Tagliarus/ofxparse-0.21-reproducible-wheel"
                      or repository_info.get("private") is not False
                      or repository_info.get("visibility") != "public"
                      or repository_info.get("default_branch") != "main"):
                  raise RuntimeError("initial_push_repository_api_identity_invalid")
              commit = get_public_api_object(
                  "/repos/Tagliarus/ofxparse-0.21-reproducible-wheel/commits/" + github_sha)
              expected_paths = {"README.md", ".github/workflows/phase83-ofxparse-wheel.yml"}
              files = commit.get("files") if isinstance(commit, dict) else None
              parents = commit.get("parents") if isinstance(commit, dict) else None
              observed = {row.get("filename") for row in files if isinstance(row, dict)} if isinstance(files, list) else set()
              if (commit.get("sha") != github_sha or parents != [] or not isinstance(files, list)
                      or len(files) != len(expected_paths) or observed != expected_paths
                      or any(row.get("status") != "added" for row in files if isinstance(row, dict))):
                  raise RuntimeError("initial_push_api_commit_tree_mismatch")

          if (github_repository != "Tagliarus/ofxparse-0.21-reproducible-wheel" or github_ref != "refs/heads/main"
                  or not re.fullmatch(r"[0-9a-f]{40}", github_sha)
                  or github_workflow_ref != f"{github_repository}/.github/workflows/phase83-ofxparse-wheel.yml@{github_ref}"
                  or not raw_run_id.isdecimal() or str(int(raw_run_id)) != raw_run_id or int(raw_run_id) <= 0
                  or runner_os != "Linux" or not runner_image_os or not runner_image_version):
              raise RuntimeError("runner_or_workflow_identity_invalid")
          verify_initial_push_commit()

          # Resolve the official image digest before any source or tool input is fetched.
          run(["docker", "pull", IMAGE_TAG])
          image_rows = json.loads(run(["docker", "image", "inspect", "--format", "{{json .RepoDigests}}", IMAGE_TAG]))
          image_ref = next((item for item in image_rows if item.startswith("python@sha256:") or item.startswith("docker.io/library/python@sha256:")), None)
          if not image_ref or "@sha256:" not in image_ref:
              raise RuntimeError("official_python_image_digest_missing")
          image_digest = image_ref.rsplit("@", 1)[1]
          if len(image_digest) != 71 or not image_digest.startswith("sha256:"):
              raise RuntimeError("official_python_image_digest_invalid")
          image = "python@" + image_digest
          docker_server_version = run(["docker", "version", "--format", "{{.Server.Version}}"])

          def fetch(item, destination):
              request = urllib.request.Request(item["url"], headers={"User-Agent": "ofxparse-0.21-wheel/1"})
              with urllib.request.urlopen(request, timeout=45) as response:
                  if response.geturl() != item["url"]:
                      raise RuntimeError("unexpected_artifact_redirect")
                  payload = response.read(item["size"] + 1)
              if len(payload) != item["size"] or hashlib.sha256(payload).hexdigest() != item["sha256"]:
                  raise RuntimeError(f"artifact_hash_or_size_mismatch:{item['name']}")
              destination.write_bytes(payload)

          fetch(SOURCE, INPUT / SOURCE["name"])
          for item in BUILD_TOOLS:
              fetch(item, INPUT / item["filename"])
          source_before = sha256(INPUT / SOURCE["name"])
          tools_evidence = [{**item, "bytes_verified": True} for item in BUILD_TOOLS]

          # A trusted setup container creates a no-pip venv and installs only the
          # two hash-checked offline wheels. Package source is not executed here.
          toolchain_owner = (os.getuid(), os.getgid())
          setup_code = r'''import json, os, subprocess, sys, venv
          root = "/toolchain"
          envdir = root + "/venv"
          home = root + "/home"
          temporary = root + "/tmp"
          os.makedirs(home, exist_ok=True)
          os.makedirs(temporary, exist_ok=True)
          venv.create(envdir, with_pip=False)
          interpreter = envdir + "/bin/python"
          purelib = envdir + "/lib/python3.11/site-packages"
          os.makedirs(purelib, exist_ok=True)
          wheels = ["/input/pip-26.3-py3-none-any.whl", "/input/setuptools-84.2.1-py3-none-any.whl"]
          install_env = {"PATH": "/usr/local/bin:/usr/bin:/bin", "HOME": home, "TMPDIR": temporary,
                         "PYTHONPATH": wheels[0], "PYTHONDONTWRITEBYTECODE": "1", "PYTHONNOUSERSITE": "1",
                         "PIP_CONFIG_FILE": "/dev/null", "PIP_NO_INDEX": "1", "PIP_DISABLE_PIP_VERSION_CHECK": "1"}
          def bounded_output(value):
              text = "" if value is None else str(value)
              text = "".join(character if character.isprintable() else " " for character in text)
              suffix = "...[truncated]"
              return text if len(text) <= 256 else text[-(256 - len(suffix)):] + suffix
          def run_setup_subprocess(phase, command, env):
              try:
                  result = subprocess.run(command, env=env, check=False, capture_output=True, text=True)
              except OSError as error:
                  diagnostic = {"phase": phase, "executable": command[0], "exit_code": None,
                                "stdout": "", "stderr": bounded_output(error)}
                  raise RuntimeError("setup_subprocess_failed:" + json.dumps(diagnostic, sort_keys=True)) from error
              if result.returncode:
                  diagnostic = {"phase": phase, "executable": command[0], "exit_code": result.returncode,
                                "stdout": bounded_output(result.stdout), "stderr": bounded_output(result.stderr)}
                  raise RuntimeError("setup_subprocess_failed:" + json.dumps(diagnostic, sort_keys=True))
              return result
          command = [interpreter, "-m", "pip", "install", "--no-index", "--ignore-installed", "--disable-pip-version-check", "--target", purelib, *wheels]
          run_setup_subprocess("install_offline_build_tools", command, install_env)
          check_env = {"PATH": envdir + "/bin:/usr/local/bin:/usr/bin:/bin", "HOME": home, "TMPDIR": temporary,
                       "PYTHONPATH": purelib, "PYTHONDONTWRITEBYTECODE": "1", "PYTHONNOUSERSITE": "1",
                       "PIP_CONFIG_FILE": "/dev/null", "PIP_NO_INDEX": "1", "PIP_DISABLE_PIP_VERSION_CHECK": "1"}
          result = run_setup_subprocess("pip_check", [interpreter, "-m", "pip", "check"], check_env)
          metadata_code = "import json,importlib.metadata; print(json.dumps({'pip':importlib.metadata.version('pip'),'setuptools':importlib.metadata.version('setuptools')}))"
          versions = run_setup_subprocess("verify_tool_versions", [interpreter, "-c", metadata_code], check_env)
          installed = json.loads(versions.stdout)
          if installed != {"pip": "26.3", "setuptools": "84.2.1"}:
              raise RuntimeError("pinned_tool_versions_mismatch")
          pip_import_code = "import pip; print(pip.__version__)"
          pip_runtime = run_setup_subprocess("verify_pip_runtime_import", [interpreter, "-c", pip_import_code], check_env)
          if pip_runtime.stdout.strip() != installed["pip"]:
              raise RuntimeError("pinned_pip_runtime_mismatch")
          setuptools_backend_code = "import setuptools; import setuptools.build_meta; from setuptools.command.bdist_wheel import bdist_wheel; print(setuptools.__version__)"
          setuptools_backend = run_setup_subprocess("verify_setuptools_backend_import", [interpreter, "-c", setuptools_backend_code], check_env)
          if setuptools_backend.stdout.strip() != installed["setuptools"]:
              raise RuntimeError("pinned_setuptools_backend_mismatch")
          print(json.dumps({"python": sys.version.split()[0], **installed, "pip_check": "clean",
                            "install_network": "none", "install_requires_hash_verified_input": True}, sort_keys=True))
          '''
          setup_command = ["docker", "run", "--rm", "--network=none", "--read-only", "--cap-drop=ALL", "--security-opt=no-new-privileges",
                           "--user", f"{toolchain_owner[0]}:{toolchain_owner[1]}",
                           "--mount", f"type=bind,source={INPUT},target=/input,readonly",
                           "--mount", f"type=bind,source={TOOLS},target=/toolchain",
                           image, "/usr/local/bin/python", "-c", setup_code]
          setup_result = json.loads(run(setup_command))
          if setup_result.get("pip_check") != "clean" or setup_result.get("python") != "3.11.9":
              raise RuntimeError("isolated_toolchain_setup_not_verified")

          build_wrapper_source = r'''import hashlib, json, os, pathlib, socket, stat, subprocess, sys, uuid
          IN_CONTAINER_RESULTS = ("uid_non_root", "capabilities_zero", "no_new_privs", "readonly_rootfs",
              "input_readonly", "runtime_readonly", "toolchain_readonly", "work_write", "out_write",
              "loopback_positive", "external_tcp_parent_denied", "external_tcp_child_denied", "input_write_denied",
              "input_chmod_denied", "runtime_write_denied", "runtime_chmod_denied", "toolchain_write_denied",
              "toolchain_chmod_denied", "host_cwd_inaccessible", "host_sentinel_inaccessible", "host_fd_inaccessible",
              "private_pid_namespace", "private_mount_namespace", "docker_socket_absent", "host_proc_absent")
          def write_ok(directory):
              path = pathlib.Path(directory) / (".phase83-" + uuid.uuid4().hex)
              path.write_bytes(b"ok"); path.unlink(); return "passed"
          def denied_write(path):
              try:
                  with open(path, "ab"): pass
              except OSError: return "passed"
              return "failed"
          def denied_chmod(path):
              try: os.chmod(path, stat.S_IMODE(os.stat(path).st_mode))
              except OSError: return "passed"
              return "failed"
          def external_denied():
              try: socket.create_connection(("1.1.1.1", 443), timeout=2).close()
              except OSError: return "passed"
              return "failed"
          def loopback_ok():
              server = socket.socket(); server.bind(("127.0.0.1", 0)); server.listen(1)
              client = socket.socket(); client.settimeout(2); client.connect(server.getsockname())
              peer, _ = server.accept(); peer.close(); client.close(); server.close(); return "passed"
          def mount_options(target):
              matches = []
              for line in pathlib.Path("/proc/self/mountinfo").read_text().splitlines():
                  parts = line.split()
                  mountpoint = parts[4].replace("\\040", " ")
                  if target == mountpoint or target.startswith(mountpoint.rstrip("/") + "/"):
                      matches.append((len(mountpoint), set(parts[5].split(","))))
              return max(matches, default=(0, set()), key=lambda row: row[0])[1]
          def collect_probe_results(host_pid, host_pid_ns, host_mnt_ns, host_fd, host_cwd, host_sentinel):
              status = pathlib.Path("/proc/self/status").read_text()
              fields = {line.split(":", 1)[0]: line.split(":", 1)[1].strip() for line in status.splitlines() if ":" in line}
              caps = all(int(fields.get(key, "-1"), 16) == 0 for key in ("CapEff", "CapPrm", "CapInh", "CapAmb", "CapBnd"))
              capability_sets = {key: fields.get(key, "") for key in ("CapEff", "CapPrm", "CapInh", "CapAmb", "CapBnd")}
