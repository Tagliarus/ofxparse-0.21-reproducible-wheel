          validated_wheels = {}
          try:
              for index in (1, 2):
                  label = f"build-{index}"
                  work_dir, output_dir = WORK / label, OUT / label
                  work_dir.mkdir(parents=True, exist_ok=True)
                  output_dir.mkdir(parents=True, exist_ok=True)
                  (work_dir / "home").mkdir()
                  (work_dir / "tmp").mkdir()
                  container_name = f"phase83-{label}-wheel"
                  build_mounts = [(INPUT, "/input", True), (TOOLS, "/toolchain", True),
                                  (work_dir, "/work", False), (output_dir, "/out", False)]
                  host_probe_args = [str(os.getpid()), str(host_pid_ns), str(host_mnt_ns), str(host_fd), host_cwd, str(sentinel)]
