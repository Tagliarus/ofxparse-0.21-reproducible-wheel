                  "host_proc_absent": "passed" if not os.path.exists("/host" + "/proc") else "failed",
                  "pip_check": "clean" if pip_ok else "failed",
                  "source_sha256": hashlib.sha256(pathlib.Path("/input/ofxparse-0.21.tar.gz").read_bytes()).hexdigest(),
              }
          def gate_and_exec_build(results, container_name, command, env):
              if any(results.get(key) != "passed" for key in IN_CONTAINER_RESULTS) or results.get("pip_check") != "clean":
                  raise RuntimeError("trusted_probe_gate_failed")
              if not command or not os.path.isabs(command[0]): raise RuntimeError("backend_command_invalid")
