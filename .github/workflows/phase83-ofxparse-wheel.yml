              print(json.dumps(results, sort_keys=True), flush=True)
              os.execve(command[0], command, env)
          def main():
              if len(sys.argv) < 10 or sys.argv[8] != "--": raise RuntimeError("trusted_wrapper_arguments_invalid")
              container_name = sys.argv[1]
              results = collect_probe_results(*sys.argv[2:8])
              if results.get("source_sha256") != os.environ.get("PHASE83_SOURCE_SHA256"):
                  raise RuntimeError("probe_source_hash_mismatch")
              gate_and_exec_build(results, container_name, sys.argv[9:], os.environ.copy())
          if __name__ == "__main__": main()
          '''
          wrapper_file = INPUT / "trusted-build-wrapper.py"
          wrapper_file.write_text(build_wrapper_source, encoding="utf-8")
          host_pid_ns = os.stat("/proc/self/ns/pid").st_ino
          host_mnt_ns = os.stat("/proc/self/ns/mnt").st_ino
          host_cwd = os.getcwd()
          sentinel = ROOT / "host-sentinel.bin"
          sentinel.write_bytes(b"host-only")
          sentinel_fd = sentinel.open("rb")
          host_fd = sentinel_fd.fileno()
          uid, gid = os.getuid(), os.getgid()

          def inspect_container(name, mounts, expected_image=None, expected_command=None):
              inspect = json.loads(run(["docker", "inspect", name]))[0]
              config = inspect["HostConfig"]
              container_id = inspect.get("Id", "")
              container_name = inspect.get("Name", "")
              if not re.fullmatch(r"[0-9a-f]{64}", container_id) or container_name.lstrip("/") != name:
                  raise RuntimeError("docker_container_identity_mismatch")
              if config.get("NetworkMode") != "none" or not config.get("ReadonlyRootfs") or config.get("Privileged"):
                  raise RuntimeError("docker_security_config_mismatch")
              if "ALL" not in (config.get("CapDrop") or []) or not any("no-new-privileges" in item for item in (config.get("SecurityOpt") or [])):
                  raise RuntimeError("docker_privilege_config_mismatch")
              if str(inspect["Config"].get("User", "")).split(":", 1)[0] in {"", "0", "root"}:
                  raise RuntimeError("docker_user_is_root")
              if expected_image is not None and inspect["Config"].get("Image") != expected_image:
                  raise RuntimeError("docker_image_reference_mismatch")
              if expected_command is not None and inspect["Config"].get("Cmd") != expected_command:
                  raise RuntimeError("docker_command_mismatch")
              if config.get("PidMode") == "host" or config.get("IpcMode") == "host":
                  raise RuntimeError("host_namespace_shared")
              observed = {row["Destination"]: (Path(row["Source"]).resolve(), not row["RW"]) for row in inspect["Mounts"]}
              expected = {target: (host.resolve(), readonly) for host, target, readonly in mounts}
              forbidden_targets = {"/proc", "/host" + "/proc", "/var/run" + "/docker.sock"}
              if observed != expected or any(target in forbidden_targets for target in observed):
                  raise RuntimeError("docker_mount_set_mismatch")
              build_label = name.removeprefix("phase83-").removesuffix("-wheel")
              if build_label not in {"build-1", "build-2"}:
                  raise RuntimeError("docker_build_label_invalid")
              source_labels = {"/input": "input", "/toolchain": "toolchain", "/work": "work/" + build_label,
                               "/out": "out/" + build_label}
              return {"network_mode": config["NetworkMode"], "readonly_rootfs": config["ReadonlyRootfs"],
                      "cap_drop": config["CapDrop"], "security_opt": config["SecurityOpt"],
                      "user": inspect["Config"]["User"], "pid_mode": config.get("PidMode", ""),
                      "ipc_mode": config.get("IpcMode", ""), "privileged": config.get("Privileged", False),
                      "container_id": container_id, "container_name": container_name,
                      "image_reference": inspect["Config"].get("Image"),
                      "mounts": [{"source": source_labels[target], "target": target, "read_only": readonly}
                                  for target, (_source, readonly) in sorted(observed.items())]}

          def create_start_wait(name, command, mounts, expected_image=None, expected_command=None):
              created_id = run(command).strip()
              if not re.fullmatch(r"[0-9a-f]{64}", created_id):
                  raise RuntimeError("docker_create_id_invalid")
              try:
                  result = inspect_container(name, mounts, expected_image, expected_command)
                  if result["container_id"] != created_id:
                      raise RuntimeError("docker_created_inspected_id_mismatch")
                  run(["docker", "start", name])
                  code = int(run(["docker", "wait", name]).strip())
                  logs = run(["docker", "logs", name])
                  if code:
                      raise RuntimeError(f"container_failed:{name}:{logs[-1200:]}")
                  return result, logs
              finally:
                  run(["docker", "rm", name])

          def build_container_command(name, image, uid, gid, mounts, host_probe_args, epoch, source_sha256):
              command = ["docker", "create", "--name", name, "--network=none", "--read-only", "--cap-drop=ALL",
                         "--security-opt=no-new-privileges", "--user", f"{uid}:{gid}", "--workdir=/work"]
              for host_path, target, readonly in mounts:
                  option = ",readonly" if readonly else ""
                  command += ["--mount", f"type=bind,source={host_path},target={target}{option}"]
              command += ["--env", f"SOURCE_DATE_EPOCH={epoch}", "--env", "PHASE83_SOURCE_SHA256=" + source_sha256,
                  "--env", "PIP_CONFIG_FILE=/dev/null", "--env", "PIP_NO_INDEX=1", "--env", "PIP_DISABLE_PIP_VERSION_CHECK=1",
                  "--env", "PYTHONDONTWRITEBYTECODE=1", "--env", "PYTHONNOUSERSITE=1", "--env", "HOME=/work/home", "--env", "TMPDIR=/work/tmp",
                  image, "/toolchain/venv/bin/python", "/input/trusted-build-wrapper.py", name, *host_probe_args, "--",
                  "/toolchain/venv/bin/python", "-m", "pip", "wheel", "--no-deps", "--no-index", "--no-cache-dir",
                  "--disable-pip-version-check", "--no-build-isolation", "--wheel-dir=/out", "/input/ofxparse-0.21.tar.gz"]
              return command

          def wheel_evidence(payload):
              filename = "ofxparse-0.21-py3-none-any.whl"
              if not isinstance(payload, bytes) or not payload or len(payload) > MAX_WHEEL_BYTES:
                  raise RuntimeError("wheel_evidence_bytes_not_validated")
              try:
                  archive = zipfile.ZipFile(io.BytesIO(payload), mode="r")
              except (OSError, zipfile.BadZipFile) as error:
                  raise RuntimeError("wheel_zip_invalid") from error
