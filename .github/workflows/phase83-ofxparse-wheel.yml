                          raise RuntimeError("wheel_member_size_out_of_range")
                      total_size += member.file_size
                      if total_size > MAX_WHEEL_UNCOMPRESSED_BYTES:
                          raise RuntimeError("wheel_total_size_out_of_range")
                      regular.add(path_text)
                  metadata_path = "ofxparse-0.21.dist-info/METADATA"
                  wheel_path = "ofxparse-0.21.dist-info/WHEEL"
                  required = {"ofxparse/__init__.py", metadata_path, wheel_path, "ofxparse-0.21.dist-info/RECORD"}
                  if not required.issubset(regular):
                      raise RuntimeError("wheel_required_member_missing")
                  metadata_text = archive.read(metadata_path).decode("utf-8")
                  wheel_text = archive.read(wheel_path).decode("utf-8")
