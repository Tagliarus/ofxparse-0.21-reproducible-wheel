                  "artifact_name": "phase83-ofxparse-public-build", "binary_committed": False,
              }
              (ARTIFACT / "evidence.json").write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              validate_artifact_tree(ARTIFACT, {
                  "build-1/ofxparse-0.21-py3-none-any.whl", "build-2/ofxparse-0.21-py3-none-any.whl",
