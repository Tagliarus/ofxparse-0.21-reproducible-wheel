                                "source_sha256": source_before, "wheel_sha256": hashlib.sha256(first_bytes).hexdigest(),
                                "github_run_id": controls["github"]["run_id"], "github_sha": controls["github"]["sha"],
                                "bundle_sha256": bundle_sha256, "bundle_size": bundle_size,
                                "bundle_chunk_count": len(encoded_chunks), "job_output_utf16_bytes": utf16_bytes}, sort_keys=True))
