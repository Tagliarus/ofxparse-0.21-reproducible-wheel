              "docker_socket_absent", "host_proc_absent", "pip_check", "source_unchanged",
          )

          def fail(reason):
              raise RuntimeError(reason)

          def validate_wheel_bytes(payload):
              if not payload or len(payload) > 2 * 1024 * 1024:
                  fail("public_bundle_wheel_size_invalid")
              try:
                  archive = zipfile.ZipFile(io.BytesIO(payload), "r")
              except (OSError, zipfile.BadZipFile):
                  fail("public_bundle_wheel_zip_invalid")
              with archive:
                  rows = archive.infolist()
                  if not rows or len(rows) > 512:
                      fail("public_bundle_wheel_member_count_invalid")
                  names = set()
                  regular = set()
                  total = 0
                  for row in rows:
                      name = row.filename
                      parts = name[:-1].split("/") if name.endswith("/") else name.split("/")
                      mode = stat.S_IFMT(row.external_attr >> 16)
                      if (not name or "\\" in name or name.startswith("/") or re.match(r"^[A-Za-z]:", name)
                              or any(part in {"", ".", ".."} for part in parts) or name in names):
                          fail("public_bundle_wheel_path_invalid")
                      names.add(name)
                      if row.is_dir():
                          if mode not in {0, stat.S_IFDIR}:
                              fail("public_bundle_wheel_member_type_invalid")
                          continue
                      if mode not in {0, stat.S_IFREG} or row.file_size < 0 or row.file_size > 5 * 1024 * 1024:
                          fail("public_bundle_wheel_member_type_or_size_invalid")
                      total += row.file_size
                      if total > 5 * 1024 * 1024:
                          fail("public_bundle_wheel_total_size_invalid")
                      regular.add(name)
                  if archive.testzip() is not None:
                      fail("public_bundle_wheel_crc_mismatch")
                  required = {"ofxparse/__init__.py", "ofxparse-0.21.dist-info/METADATA",
                              "ofxparse-0.21.dist-info/WHEEL", "ofxparse-0.21.dist-info/RECORD"}
                  if not required.issubset(regular):
                      fail("public_bundle_wheel_required_member_missing")
                  metadata = email.parser.Parser().parsestr(archive.read("ofxparse-0.21.dist-info/METADATA").decode("utf-8"))
                  wheel_lines = archive.read("ofxparse-0.21.dist-info/WHEEL").decode("utf-8").splitlines()
              wheel_headers = {key.strip().casefold(): value.strip().casefold()
                               for line in wheel_lines if ":" in line for key, value in [line.split(":", 1)]}
              normalized = re.sub(r"[-_.]+", "-", str(metadata.get("Name", ""))).casefold()
              if normalized != "ofxparse" or metadata.get("Version") != "0.21":
                  fail("public_bundle_wheel_package_identity_invalid")
              if wheel_headers.get("root-is-purelib") != "true" or wheel_headers.get("tag") != "py3-none-any":
                  fail("public_bundle_wheel_tag_invalid")
              return {"filename": "ofxparse-0.21-py3-none-any.whl", "tag": "py3-none-any",
                      "size": len(payload), "sha256": hashlib.sha256(payload).hexdigest()}

          def validate_controls_and_evidence(controls_bytes, evidence_bytes, controls, evidence, first, second, run_id, commit):
              identity = controls.get("runtime_identity")
              github = controls.get("github")
              workflow = controls.get("workflow")
              runner = controls.get("runner")
              image = controls.get("image")
              if (controls_bytes != json.dumps(controls, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
                      or controls.get("schema_version") != 3 or controls.get("provider") != "github_actions_docker_public_release"
                      or controls.get("status") != "verified" or controls.get("source_sha256") != SOURCE["sha256"]
                      or controls.get("build_dependencies") != EXPECTED_TOOLS
                      or controls.get("source_date_epoch") != {"value": SOURCE_DATE_EPOCH, "basis": "fixed recipe policy input"}
                      or not isinstance(identity, dict) or not isinstance(github, dict) or not isinstance(workflow, dict)
                      or not isinstance(runner, dict) or not isinstance(image, dict)
                      or identity.get("provider") != "github_actions_docker_public_release"
                      or identity.get("repository") != REPOSITORY or identity.get("run_id") != int(run_id)
                      or identity.get("commit_sha") != commit or identity.get("workflow_path") != WORKFLOW_PATH
                      or identity.get("workflow_ref") != REPOSITORY + "/" + WORKFLOW_PATH + "@refs/heads/main"
                      or identity.get("workflow_ref") != github.get("workflow_ref")
                      or identity.get("commit_sha") != github.get("sha") or identity.get("run_id") != github.get("run_id")
                      or github.get("ref") != "refs/heads/main" or workflow.get("path") != WORKFLOW_PATH
                      or identity.get("runner") != runner or runner.get("os") != "Linux"
                      or not all(isinstance(runner.get(key), str) and runner[key].strip() for key in ("image_os", "image_version", "docker_server_version"))
                      or image.get("tag") != "python:3.11.9-slim-bookworm"
                      or image.get("reference") != "python@" + str(identity.get("image_digest"))
                      or image.get("digest") != identity.get("image_digest")
                      or not re.fullmatch(r"sha256:[0-9a-f]{64}", str(identity.get("image_digest", "")))):
                  fail("public_bundle_controls_identity_or_pins_invalid")
              probes = controls.get("probes")
              if not isinstance(probes, list) or len(probes) != 2:
                  fail("public_bundle_probe_count_invalid")
              for label, probe in zip(("build-1", "build-2"), probes):
                  if (not isinstance(probe, dict) or probe.get("label") != label
                          or not isinstance(probe.get("container_id"), str)
                          or not re.fullmatch(r"[0-9a-f]{64}", probe["container_id"])
                          or probe.get("build_container_inspected_before_start") is not True
                          or probe.get("container") != probe.get("build_container")
                          or probe.get("container", {}).get("container_id") != probe.get("container_id")):
                      fail("public_bundle_probe_container_binding_invalid")
                  container = probe["container"]
                  if (container.get("network_mode") != "none" or container.get("readonly_rootfs") is not True
                          or container.get("cap_drop") != ["ALL"] or "no-new-privileges" not in container.get("security_opt", [])
                          or container.get("privileged") is not False
                          or str(container.get("user", "")).split(":", 1)[0] in {"", "0", "root"}
                          or container.get("pid_mode") == "host" or container.get("ipc_mode") == "host"
                          or container.get("image_reference") != image.get("reference")
                          or container.get("container_name") != "/phase83-" + label + "-wheel"):
                      fail("public_bundle_probe_container_config_invalid")
                  expected_mounts = {
                      ("input", "/input", True), ("toolchain", "/toolchain", True),
                      ("work/" + label, "/work", False), ("out/" + label, "/out", False),
                  }
                  mounts = container.get("mounts")
                  if not isinstance(mounts, list) or {
                      (mount.get("source"), mount.get("target"), mount.get("read_only"))
                      for mount in mounts if isinstance(mount, dict)
                  } != expected_mounts:
                      fail("public_bundle_probe_mounts_invalid")
                  if len(mounts) != len(expected_mounts) or any(not isinstance(mount, dict) for mount in mounts):
                      fail("public_bundle_probe_mounts_invalid")
                  results = probe.get("results")
                  if not isinstance(results, dict) or any(
                      results.get(key) != ("clean" if key == "pip_check" else "passed") for key in EXPECTED_PROBES
                  ):
                      fail("public_bundle_probe_results_invalid")
              if (evidence.get("schema_version") != 3 or evidence.get("provider") != "github_actions_docker_public_release"
                      or evidence.get("status") != "verified" or evidence.get("package") != "ofxparse"
                      or evidence.get("version") != "0.21" or evidence.get("source_sha256") != SOURCE["sha256"]
                      or evidence.get("artifact_controls_sha256") != hashlib.sha256(controls_bytes).hexdigest()
                      or evidence.get("runtime_identity") != identity or evidence.get("github") != github
                      or evidence.get("workflow") != workflow or evidence.get("runner") != runner
                      or evidence.get("image") != image or evidence.get("build_dependencies") != EXPECTED_TOOLS
                      or evidence.get("binary_committed") is not False
                      or any(key in evidence for key in ("source_audit_sha256", "bundle_sha256", "zip_sha256", "artifact_zip_sha256"))):
                  fail("public_bundle_evidence_provenance_invalid")
              build = evidence.get("build")
              if (not isinstance(build, dict) or build.get("python_version") != "3.11.9"
                      or build.get("source_date_epoch") != SOURCE_DATE_EPOCH
                      or build.get("toolchain") != EXPECTED_TOOLS or build.get("byte_identical") is not True):
                  fail("public_bundle_build_evidence_invalid")
              command = build.get("command")
              if (not isinstance(command, list) or not all(isinstance(part, str) for part in command)
                      or command.count("wheel") != 1
                      or any(value not in command for value in ("--no-deps", "--no-index", "--no-build-isolation", "--wheel-dir=/out", "/input/ofxparse-0.21.tar.gz"))):
                  fail("public_bundle_build_command_invalid")
              wheel_info = validate_wheel_bytes(first)
              outputs = build.get("outputs")
              if not isinstance(outputs, list) or len(outputs) != 2:
                  fail("public_bundle_build_outputs_invalid")
              for label, row in zip(("build-1", "build-2"), outputs):
                  if not isinstance(row, dict) or row.get("label") != label or any(
                      row.get(key) != wheel_info[key] for key in ("filename", "size", "sha256")
                  ):
                      fail("public_bundle_build_output_hash_invalid")
              wheel_report = evidence.get("wheel")
              if not isinstance(wheel_report, dict) or any(
                  wheel_report.get(key) != wheel_info[key] for key in ("filename", "tag", "size", "sha256")
              ) or wheel_report.get("cache_path") != ".cache/phase83/ofxparse/0.21/wheels":
                  fail("public_bundle_wheel_evidence_invalid")

          def validate_output_budget(values):
              utf16_bytes = 0
              for name, value in values.items():
                  if not isinstance(name, str) or not name.isascii() or not isinstance(value, str) or not value.isascii():
                      fail("public_release_output_not_ascii")
                  if len((name + "=" + value).encode("ascii")) >= GITHUB_ENV_STRING_LIMIT_BYTES:
                      fail("public_release_output_value_limit_exceeded")
                  utf16_bytes += len((name + "=" + value + "\n").encode("utf-16-le"))
              if utf16_bytes + GITHUB_JOB_OUTPUT_RESERVE_BYTES >= GITHUB_JOB_OUTPUT_LIMIT_BYTES:
                  fail("public_release_job_output_limit_exceeded")
              return utf16_bytes

          def validate_bundle_chunks(values):
              expected_names = {
                  "BUNDLE_CHUNK_COUNT", "BUNDLE_SIZE", "BUNDLE_SHA256",
                  *(f"BUNDLE_B64_{index}" for index in range(BUNDLE_CHUNK_COUNT)),
              }
              if not isinstance(values, dict) or set(values) != expected_names:
                  fail("public_release_bundle_chunk_fields_invalid")
              validate_output_budget(values)
              count_text = values["BUNDLE_CHUNK_COUNT"]
              size_text = values["BUNDLE_SIZE"]
              expected_sha = values["BUNDLE_SHA256"]
              if not isinstance(count_text, str) or not re.fullmatch(r"[1-4]", count_text):
                  fail("public_release_bundle_chunk_count_invalid")
              if (not isinstance(size_text, str) or not re.fullmatch(r"[1-9][0-9]{0,5}", size_text)
                      or int(size_text) > MAX_BUNDLE_BYTES):
                  fail("public_release_bundle_size_invalid")
              if not isinstance(expected_sha, str) or not re.fullmatch(r"[0-9a-f]{64}", expected_sha):
                  fail("public_release_bundle_sha256_invalid")
              count = int(count_text)
              pieces = []
              for index in range(BUNDLE_CHUNK_COUNT):
                  chunk = values[f"BUNDLE_B64_{index}"]
                  if not isinstance(chunk, str) or not chunk.isascii() or any(character.isspace() for character in chunk):
                      fail("public_release_bundle_chunk_invalid")
                  if len(chunk) > BUNDLE_CHUNK_BYTES:
                      fail("public_release_bundle_chunk_size_invalid")
                  if index < count:
                      if not chunk:
                          fail("public_release_bundle_chunk_missing")
                      pieces.append(chunk)
                  elif chunk:
                      fail("public_release_bundle_trailing_chunk_nonempty")
              encoded = "".join(pieces)
              try:
                  payload = base64.b64decode(encoded, validate=True)
              except (ValueError, base64.binascii.Error):
                  fail("public_release_bundle_base64_invalid")
              if base64.b64encode(payload).decode("ascii") != encoded:
                  fail("public_release_bundle_base64_noncanonical")
              if not payload or len(payload) > MAX_BUNDLE_BYTES or len(payload) != int(size_text):
                  fail("public_release_bundle_size_mismatch")
              if hashlib.sha256(payload).hexdigest() != expected_sha:
                  fail("public_release_bundle_sha256_mismatch")
              return payload

          def pinned_post(url, data, headers, *, expected_origin, expected_path, expected_query="", timeout=30):
              parsed = urllib.parse.urlsplit(url)
              expected = urllib.parse.urlsplit(expected_origin)
              origin = parsed.scheme + "://" + parsed.netloc
              if (origin != expected_origin or parsed.scheme != expected.scheme or parsed.netloc != expected.netloc
                      or expected.scheme not in {"https", "http"} or expected.path or expected.query
                      or parsed.path != expected_path or parsed.query != expected_query or parsed.fragment
                      or parsed.username is not None or parsed.password is not None
                      or (parsed.scheme == "https" and parsed.port not in {None, 443})
                      or (parsed.scheme == "http" and parsed.port is None)):
                  fail("github_release_post_endpoint_not_pinned")
              request = urllib.request.Request(url, data=data, method="POST", headers=headers)

              class RejectRedirects(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, _request, _fp, _code, _msg, _headers, _newurl):
                      fail("github_release_redirect_rejected")

              opener = urllib.request.build_opener(RejectRedirects())
              try:
                  with opener.open(request, timeout=timeout) as response:
                      return response.read(256 * 1024)
              except urllib.error.HTTPError as error:
                  if 300 <= error.code < 400:
                      fail("github_release_redirect_rejected")
                  raise RuntimeError("github_release_http_" + str(error.code)) from None

          def request_json(url, token, value, *, expected_origin, expected_path):
              body = json.dumps(value, separators=(",", ":")).encode("utf-8")
              response = pinned_post(url, body, {
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + token,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "ofxparse-0.21-reproducible-wheel",
                  "Content-Type": "application/json",
              }, expected_origin=expected_origin, expected_path=expected_path)
              try:
                  return json.loads(response.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError):
                  fail("github_release_json_response_invalid")

          def main():
              repository = os.environ.get("GITHUB_REPOSITORY", "")
              ref = os.environ.get("GITHUB_REF", "")
              commit = os.environ.get("GITHUB_SHA", "").casefold()
              run_id = os.environ.get("GITHUB_RUN_ID", "")
              attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "")
              token = os.environ.get("GITHUB_TOKEN", "")
              expected_sha = os.environ.get("BUNDLE_SHA256", "")
              raw_size = os.environ.get("BUNDLE_SIZE", "")
              bundle_values = {
                  "BUNDLE_CHUNK_COUNT": os.environ.get("BUNDLE_CHUNK_COUNT", ""),
                  "BUNDLE_SIZE": raw_size,
                  "BUNDLE_SHA256": expected_sha,
                  **{f"BUNDLE_B64_{index}": os.environ.get(f"BUNDLE_B64_{index}", "")
                     for index in range(BUNDLE_CHUNK_COUNT)},
              }
              if (repository != REPOSITORY or ref != "refs/heads/main"
                      or not re.fullmatch(r"[0-9a-f]{40}", commit)
                      or not re.fullmatch(r"[1-9][0-9]{0,19}", run_id)
                      or not re.fullmatch(r"[1-9][0-9]{0,5}", attempt)
                      or not token or not re.fullmatch(r"[0-9a-f]{64}", expected_sha)
                      or not re.fullmatch(r"[1-9][0-9]{0,5}", raw_size)):
                  fail("public_release_inputs_invalid")
              environment_values = {
                  "GITHUB_TOKEN": token, "GITHUB_REPOSITORY": repository, "GITHUB_REF": ref,
                  "GITHUB_SHA": commit, "GITHUB_RUN_ID": run_id, "GITHUB_RUN_ATTEMPT": attempt,
                  **bundle_values,
              }
              validate_output_budget(environment_values)
              payload = validate_bundle_chunks(bundle_values)
              bundle_sha = hashlib.sha256(payload).hexdigest()
              expected_members = {
                  "build-1/ofxparse-0.21-py3-none-any.whl",
                  "build-2/ofxparse-0.21-py3-none-any.whl",
                  "controls.json",
                  "evidence.json",
              }
              with zipfile.ZipFile(io.BytesIO(payload), "r") as archive:
                  rows = archive.infolist()
                  if len(rows) != len(expected_members) or {row.filename for row in rows} != expected_members:
                      fail("public_bundle_member_allowlist_mismatch")
                  for row in rows:
                      mode = stat.S_IFMT(row.external_attr >> 16)
                      if (row.is_dir() or mode not in {0, stat.S_IFREG} or "\\" in row.filename
                              or row.filename.startswith("/") or ".." in row.filename.split("/")):
                          fail("public_bundle_unsafe_member")
                      if row.file_size <= 0 or row.file_size > MAX_BUNDLE_BYTES:
                          fail("public_bundle_member_size_invalid")
                  if archive.testzip() is not None:
                      fail("public_bundle_crc_mismatch")
                  controls_bytes = archive.read("controls.json")
                  evidence_bytes = archive.read("evidence.json")
                  controls = json.loads(controls_bytes.decode("utf-8"))
                  evidence = json.loads(evidence_bytes.decode("utf-8"))
                  first = archive.read("build-1/ofxparse-0.21-py3-none-any.whl")
                  second = archive.read("build-2/ofxparse-0.21-py3-none-any.whl")
              if first != second:
                  fail("public_bundle_wheels_not_byte_identical")
              if evidence_bytes != (json.dumps(evidence, indent=2, sort_keys=True, ensure_ascii=False) + "\n").encode("utf-8"):
                  fail("public_bundle_evidence_not_canonical_json")
              validate_controls_and_evidence(controls_bytes, evidence_bytes, controls, evidence, first, second, run_id, commit)
              tag_name = "phase83-ofxparse-" + run_id + "-" + attempt
              release_path = "/repos/" + REPOSITORY + "/releases"
              release = request_json(API_RELEASE_ORIGIN + release_path, token, {
                  "tag_name": tag_name,
                  "name": "ofxparse 0.21 reproducible wheel " + run_id + "." + attempt,
                  "body": "Unpublished draft build bundle SHA-256: " + bundle_sha + "\nRun: " + run_id + " attempt " + attempt,
                  "draft": True,
                  "prerelease": False,
                  "target_commitish": commit,
              }, expected_origin=API_RELEASE_ORIGIN, expected_path=release_path)
              release_id = release.get("id")
              upload_template = release.get("upload_url", "")
              target_commitish = release.get("target_commitish")
              if (not isinstance(release_id, int) or isinstance(release_id, bool) or release_id <= 0
                      or release.get("draft") is not True or release.get("prerelease") is not False
                      or release.get("tag_name") != tag_name or target_commitish != commit
                      or not isinstance(upload_template, str)):
                  fail("public_draft_release_response_invalid")
              upload_url = upload_template.split("{", 1)[0]
              parsed = urllib.parse.urlsplit(upload_url)
              expected_path = "/repos/" + REPOSITORY + "/releases/" + str(release_id) + "/assets"
              if parsed.scheme != "https" or parsed.netloc != "uploads.github.com" or parsed.path != expected_path or parsed.query:
                  fail("public_release_upload_url_invalid")
              asset_url = upload_url + "?" + urllib.parse.urlencode({"name": "phase83-ofxparse-build.zip"})
              asset_bytes = pinned_post(asset_url, payload, {
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + token,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/zip",
                  "User-Agent": "ofxparse-0.21-reproducible-wheel",
              }, expected_origin=API_UPLOAD_ORIGIN, expected_path=expected_path,
                 expected_query="name=phase83-ofxparse-build.zip", timeout=60)
              try:
                  asset = json.loads(asset_bytes.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError):
                  fail("github_release_asset_response_invalid")
              if (not isinstance(asset.get("id"), int) or isinstance(asset.get("id"), bool) or asset.get("id") <= 0
                      or asset.get("name") != "phase83-ofxparse-build.zip" or asset.get("size") != len(payload)
                      or asset.get("state") != "uploaded"):
                  fail("public_release_asset_response_invalid")
              summary = {"status": "draft_asset_uploaded", "repository": REPOSITORY, "run_id": int(run_id),
                         "commit_sha": commit, "release_id": release_id, "asset_id": asset["id"],
                         "bundle_sha256": bundle_sha, "bundle_size": len(payload)}
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
                  stream.write("## ofxparse 0.21 draft bundle\n\n")
                  stream.write("Repository: " + REPOSITORY + "\n")
                  stream.write("Run: " + run_id + " / attempt " + attempt + "\n")
                  stream.write("Release ID: " + str(release_id) + "; asset ID: " + str(asset["id"]) + "\n")
                  stream.write("ZIP SHA-256: " + bundle_sha + "; bytes: " + str(len(payload)) + "\n")
              print(json.dumps(summary, sort_keys=True))

          main()
          PY
