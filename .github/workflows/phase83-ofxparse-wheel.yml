                  "mount_options": {path: sorted(mount_options(path)) for path in ("/", "/input", "/usr/local/bin/python", "/toolchain", "/work", "/out")},
                  "uid_non_root": "passed" if os.geteuid() != 0 else "failed", "capabilities_zero": "passed" if caps else "failed",
                  "no_new_privs": "passed" if fields.get("NoNewPrivs") == "1" else "failed",
                  "readonly_rootfs": "passed" if "ro" in mount_options("/") else "failed",
                  "input_readonly": "passed" if "ro" in mount_options("/input") else "failed",
                  "runtime_readonly": "passed" if "ro" in mount_options("/usr/local/bin/python") else "failed",
                  "toolchain_readonly": "passed" if "ro" in mount_options("/toolchain") else "failed",
                  "work_write": write_ok("/work"), "out_write": write_ok("/out"), "loopback_positive": loopback_ok(),
                  "external_tcp_parent_denied": external_denied(), "external_tcp_child_denied": "passed" if child.returncode == 0 else "failed",
                  "input_write_denied": denied_write("/input/ofxparse-0.21.tar.gz"), "input_chmod_denied": denied_chmod("/input/ofxparse-0.21.tar.gz"),
                  "runtime_write_denied": denied_write("/usr/local/bin/python"), "runtime_chmod_denied": denied_chmod("/usr/local/bin/python"),
                  "toolchain_write_denied": denied_write("/toolchain/venv/bin/python"), "toolchain_chmod_denied": denied_chmod("/toolchain/venv/bin/python"),
                  "host_cwd_inaccessible": "passed" if not os.path.exists(host_cwd) else "failed",
                  "host_sentinel_inaccessible": "passed" if not os.path.exists(host_sentinel) else "failed",
                  "host_fd_inaccessible": "passed" if not os.path.exists(f"/proc/{host_pid}/fd/{host_fd}") else "failed",
                  "private_pid_namespace": "passed" if pid_ns != int(host_pid_ns) else "failed",
                  "private_mount_namespace": "passed" if mnt_ns != int(host_mnt_ns) else "failed",
