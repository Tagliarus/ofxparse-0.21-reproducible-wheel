                           if ":" in line for key, value in [line.split(":", 1)]}
                  normalized_name = re.sub(r"[-_.]+", "-", metadata.get("name", "")).casefold()
                  if normalized_name != "ofxparse" or metadata.get("version") != "0.21":
                      raise RuntimeError("wheel_package_identity_mismatch")
                  if wheel.get("root-is-purelib") != "true" or wheel.get("tag") != "py3-none-any":
                      raise RuntimeError("wheel_tag_or_purelib_mismatch")
              return {"filename": filename, "tag": "py3-none-any", "size": len(payload),
                      "sha256": hashlib.sha256(payload).hexdigest(), "cache_path": ".cache/phase83/ofxparse/0.21/wheels"}

          controls = {
